# Runs each time posts.txt changes, and every 6 hours. It does two things:
#   1. housekeeping: removes old posts and deleted tweets from posts.txt
#      (see tools/housekeep.js; removed lines are kept in old-posts.txt)
#   2. builds a small preview page for every post (the /p/ folder), and files
#      every post under a desk (see tools/build-share.js)
name: housekeeping and share pages

on:
  push:
    branches: [main]
    paths:
      - posts.txt
      - tools/build-share.js
      - tools/housekeep.js
      - .github/workflows/share-pages.yml
  schedule:
    - cron: '17 */6 * * *' # every 6 hours (00:17, 06:17, 12:17, 18:17 UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: share-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: housekeeping
        env:
          # deleted tweets are only checked on the 6-hourly run (and manual runs)
          CHECK_DEAD: ${{ github.event_name != 'push' && '1' || '0' }}
        run: node tools/housekeep.js
      - name: build pages
        run: node tools/build-share.js
      - name: save to the repo
        run: |
          git config user.name "blackbrief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A p tools/share-cache.json tools/housekeep-state.json tools/desk-report.json posts.txt old-posts.txt
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "housekeeping and share pages"
          git pull --rebase origin main
          git push

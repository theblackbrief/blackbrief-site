# TEST PAGE ONLY. Runs each time posts.txt changes and records which X posts
# carry an image or a video (see tools/build-media.js). Only test.html reads
# the result. It is separate from "housekeeping and share pages" on purpose,
# so the live site's automation is not touched.
#
# To remove the experiment, delete this file, tools/build-media.js and
# tools/media-cache.json.
name: media marks (test page)

on:
  push:
    branches: [main]
    paths:
      - posts.txt
      - tools/build-media.js
      - .github/workflows/media-marks.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: media-marks
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # let "housekeeping and share pages" finish first, so the two never
      # try to save to the repo at the same moment
      - name: wait for the live automation
        run: sleep 90
      - uses: actions/checkout@v4
      - name: look up media
        run: node tools/build-media.js
      - name: save to the repo
        run: |
          git config user.name "blackbrief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/media-cache.json
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "media marks"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then exit 0; fi
            sleep 10
          done
          exit 1

function showTweet(card){
wireCur=card;
var seq=++wireSeq;
var url=card.getAttribute('data-tweet');
var id=(url.match(/status\/(\d+)/)||[])[1];
var open=url.replace('twitter.com','x.com');
var a=ago(Number(card.getAttribute('data-wire-ts'))||0);
drawerDomain.textContent=twHandle(url)+(a?' // '+a:'');
drawerNewtab.href=open;
drawerHintLink.href=open;
var list=wireList(),i=wireIndex(list);
navPrev.disabled=i<=0;
navNext.disabled=i===-1||i>=list.length-1;
// hold the drawer at its present height until the next post has loaded
var h=drawerTweet.offsetHeight;
drawerTweet.style.minHeight=h>0?h+'px':'';
clearEl(drawerTweet);
drawerTweet.scrollTop=0;
var st=mkEl('div','wire-status');
st.textContent='loading post...';
drawerTweet.appendChild(st);
var box=mkEl('div');
drawerTweet.appendChild(box);
function settle(){if(seq===wireSeq)drawerTweet.style.minHeight='';}
function fail(){
if(seq!==wireSeq)return;
st.textContent='this post is not available on x right now.';
st.style.display='';
settle();
}
if(!id)return fail();
var tries=0;
(function go(){
if(seq!==wireSeq||!drawer.classList.contains('open'))return; // closed, or moved on
if(window.twttr&&window.twttr.widgets&&window.twttr.widgets.createTweet){
window.twttr.widgets.createTweet(id,box,{theme:xTheme(),dnt:true,align:'center'}).then(function(el){
if(seq!==wireSeq)return;
if(el){st.style.display='none';settle();}else fail();
},fail);
return;
}
if(tries===0)loadTw();
if(++tries>80)return fail(); // X's script did not arrive in 8 seconds
setTimeout(go,100);
})();
}

function openTweet(card){
tapDone();
wireFirst=card;
drawerBrief.style.display='none';
drawerFrame.style.display='none';
drawerFrame.src='';
clearEl(drawerTweet);
drawerTweet.style.minHeight='';
drawerTweet.style.display='block';
drawer.style.transform='';
drawer.classList.add('wire-mode');
drawerNewtab.textContent='open on x »';
overlay.classList.add('open');
drawer.classList.add('open');
document.body.style.overflow='hidden';
showTweet(card);
}

function wireStep(d){
if(!wireCur||!drawer.classList.contains('wire-mode'))return;
var list=wireList(),i=wireIndex(list);
if(i===-1||!list[i+d])return;
showTweet(list[i+d]);
}
navPrev.addEventListener('click',function(){wireStep(-1);});
navNext.addEventListener('click',function(){wireStep(1);});
navShare.addEventListener('click',function(){if(wireCur)shareFrom(wireCur.getAttribute('data-wire-id'),navShare);});
document.addEventListener('keydown',function(e){
if(!drawer.classList.contains('open'))return;
if(e.key==='ArrowRight')wireStep(1);
else if(e.key==='ArrowLeft')wireStep(-1);
});

// swipe down to close. A touch that starts on the X post itself never
// reaches this page (it belongs to X's frame), so the swipe works from the
// bar at the top, the row at the bottom and the margins around the post.
var drag=null;
drawer.addEventListener('touchstart',function(e){
if(e.touches.length!==1){drag=null;return;}
var t=e.touches[0];
var inPost=!!(e.target.closest&&e.target.closest('#bb-drawer-tweet'));
drag={x:t.clientX,y:t.clientY,t:Date.now(),dy:0,on:false,ok:!inPost||drawerTweet.scrollTop<=0};
},{passive:true});
drawer.addEventListener('touchmove',function(e){
if(!drag||!drag.ok)return;
var t=e.touches[0],dy=t.clientY-drag.y,dx=t.clientX-drag.x;
if(!drag.on){
if(dy>8&&dy>Math.abs(dx)*1.2){drag.on=true;drawer.classList.add('wire-drag');}
else if(dy<-8||Math.abs(dx)>12){drag.ok=false;return;}
else return;
}
drag.dy=Math.max(0,dy);
drawer.style.transform='translateY('+drag.dy+'px)';
if(e.cancelable)e.preventDefault();
},{passive:false});
function dragEnd(){
if(!drag)return;
var d=drag;
drag=null;
if(!d.on)return;
var flick=d.dy>40&&Date.now()-d.t<280;
// let the browser register where the drawer is before it animates away or back
void drawer.offsetHeight;
drawer.classList.remove('wire-drag');
drawer.style.transform='';
if(d.dy>110||flick)closeDrawer();
}
drawer.addEventListener('touchend',dragEnd);
drawer.addEventListener('touchcancel',dragEnd);

function cardTitle(card){
var t=card.querySelector('.rich-preview-title,.headline-title');
return t?t.textContent.trim():'';
}

function openDrawer(url,dom,title){
tapDone();
// back to article mode
wireSeq++;
wireCur=wireFirst=null;
clearEl(drawerTweet);
drawerTweet.style.display='none';
drawer.classList.remove('wire-mode');
drawerNewtab.textContent='open in new tab »';
drawer.style.transform='';
drawerFrame.style.display='';
drawerBrief.style.display='';
if(!dom){try{dom=new URL(url).hostname.replace('www.','');}catch(ex){dom='';}}
drawerDomain.textContent=dom;
drawerNewtab.href=url;
drawerHintLink.href=url;
drawerTitle.textContent=title&&title!==dom?title:'';
drawerTitle.style.display=drawerTitle.textContent?'':'none';
drawerFrame.src=url;
overlay.classList.add('open');
drawer.classList.add('open');
document.body.style.overflow='hidden';
}
window.__bbOpenDrawer=openDrawer;

function closeDrawer(){
// if the reader stepped to another post, leave the page at that card
var back=wireCur&&wireCur!==wireFirst?wireCur:null;
wireSeq++;
wireCur=wireFirst=null;
overlay.classList.remove('open');
drawer.classList.remove('open');
drawer.style.transform='';
document.body.style.overflow='';
if(back&&document.body.contains(back)&&!(back.closest('#bb-archive-section')&&!sec.classList.contains('open')))back.scrollIntoView({block:'center'});
setTimeout(function(){
if(drawer.classList.contains('open'))return;
drawerFrame.src='';
clearEl(drawerTweet);
drawer.classList.remove('wire-mode');
},400);
}

overlay.addEventListener('click',closeDrawer);
drawerClose.addEventListener('click',closeDrawer);
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeDrawer();});
document.addEventListener('click',function(e){
// a desk label on a card shows that whole desk
// a stamp shows every post with that tag
var stp=e.target.closest('.stamp[data-tag]');
if(stp){
e.preventDefault();
var tg=stp.getAttribute('data-tag');
setFilter(tg==='urgent'||tg==='sus'?tg:'tag:'+tg);
return;
}
var dkb=e.target.closest('.bb-desk-btn[data-desk]');
if(dkb){
e.preventDefault();
var dsk=dkb.getAttribute('data-desk');
if(dsk)setFilter('desk:'+dsk);
return;
}
var wc=e.target.closest('.wire-card[data-tweet]');
if(wc){e.preventDefault();openTweet(wc);return;}
var rp=e.target.closest('.rich-preview[data-url],.headline-card[data-url]');
if(rp){
e.preventDefault();
openDrawer(rp.getAttribute('data-url'),'',cardTitle(rp));
}
});

// ── INITIAL LOAD ──
// (fetch the wording first; the posts request is already under way)
loadWire().then(fetchFeed).then(function(lines){
lastCheck=Date.now();
bbSyncTime=lastCheck;
allLines=lines;
render();
}).catch(function(err){
console.error('[BlackBrief]',err);
loadFailed=true;
lastCheck=Date.now();
notice('— communications failure —');
tickMode='fail';tickerUpdate();
});

// ── TICKER + FILTERS (rebuilt Oct 2026) ──
// The tagline is the subtitle under the title. The ticker scrolls live
// figures: total, last sync, newest post, posts today, live tags, and a count
// for each desk (DESKS, Oct 2026; these replaced the counts of x posts,
// articles, videos and editorials). Items shown in [ brackets ] can be tapped
// to filter the feed. Text is refreshed in place so the scroll never restarts; the strip
// is only rebuilt when the set of items or the ticker width changes.
var tickTrack=document.getElementById('bb-ticker-track');
var tickOuter=document.getElementById('bb-ticker-outer');
var tickMask=document.getElementById('bb-ticker-mask');
var tickPaused=false,tickTimer=null,tickSig='',tickMode='init',latestId=null;
var TICK_SPEED=32; // pixels per second

function plural(n,one,many){return n+' '+(n===1?one:many);}

function dayStart(){
var d=new Date();
return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
}

function matchesFilter(p,f){
if(f.indexOf('desk:')===0)return postDesk(p)===f.slice(5);
if(f.indexOf('tag:')===0)return p.tag===f.slice(4);
if(f==='urgent'||f==='sus')return p.tag===f;
if(f==='today')return !isNaN(p.ts)&&p.ts>=dayStart()&&p.ts<=Date.now()+60000;
return false;
}

// the figures, in ticker order. k = name, t = text, f = what a tap does.
function feedStats(){
var now=Date.now(),start=dayStart();
var n={today:0,urgent:0,sus:0},dn={},latest=0;
latestId=null;
allLines.map(prep).forEach(function(p){
if(!isNaN(p.ts)&&p.ts<=now+60000){
if(p.ts>latest){latest=p.ts;latestId=postId(p);}
if(p.ts>=start)n.today++;
}
if(p.tag==='urgent')n.urgent++;
if(p.tag==='sus')n.sus++;
var d=postDesk(p);
if(d)dn[d]=(dn[d]||0)+1;
});
var mins=Math.round((now-bbSyncTime)/60000);
var out=[
{k:'total',t:plural(allLines.length,'transmission','transmissions'),f:'all',dot:true},
{k:'sync',t:'synced '+(mins<1?'just now':mins+'m ago')}
];
var la=latest?ago(latest):'';
if(la)out.push({k:'latest',t:'latest '+la,f:'latest'});
if(n.today)out.push({k:'today',t:n.today+' today',f:'today'});
if(n.urgent)out.push({k:'urgent',t:n.urgent+' urgent',f:'urgent',c:'tick-urgent'});
if(n.sus)out.push({k:'sus',t:n.sus+' sus',f:'sus',c:'tick-noted'});
// desks, the busiest first (a tie keeps the order of DESKS)
DESKS.filter(function(d){return (dn[d]||0)>=DESK_MIN;})
.sort(function(a,b){return dn[b]-dn[a]||DESKS.indexOf(a)-DESKS.indexOf(b);})
.forEach(function(d){out.push({k:'desk-'+d,t:dn[d]+' /'+d,f:'desk:'+d,desk:d,n:dn[d]});});
return out;
}

function tickerItems(){
if(tickMode==='init')return[{k:'init',t:'initializing...'}];
if(tickMode==='fail')return[{k:'fail',t:'§ communications failure',c:'tick-urgent'}];
if(tickMode==='empty')return[{k:'empty',t:'no intel found'}];
var out=feedStats();
return out;
}

// the ticker figure a filter belongs to, or null if it has nothing to show
function statFor(f){
// a desk can be filtered from a card even when it is too small for the ticker
if(f&&f.indexOf('desk:')===0){
var d=f.slice(5);
var n=allLines.map(prep).filter(function(p){return postDesk(p)===d;}).length;
return n?{k:'desk-'+d,t:n+' /'+d,f:f,desk:d,n:n}:null;
}
// a tag, from tapping a stamp: sus or any custom tag (#wtf, #lol...)
if(f&&(f.indexOf('tag:')===0||f==='sus')){
var tg=f==='sus'?'sus':f.slice(4);
var tn=allLines.map(prep).filter(function(p){return p.tag===tg;}).length;
return tn?{k:'tag-'+tg,t:tn+' '+tg,f:f,tag:tg,n:tn}:null;
}
var items=feedStats();
for(var i=0;i<items.length;i++)if(items[i].f===f)return items[i];
return null;
}

// text for the "showing ..." bar; '' if that filter has nothing to show
function filterLabel(f){
var it=statFor(f);
return it?it.t:'';
}

// the red slash and the desk's name in its colour: "/money"
function deskMark(el,d){
var sl=mkEl('span','bb-desk-slash');
sl.textContent='/';
el.appendChild(sl);
var w=mkEl('span','bb-desk desk-'+d);
w.textContent=d;
el.appendChild(w);
}

function drawFilterBar(label){
clearEl(fb);
if(!label){fb.style.display='none';return;}
var it=statFor(activeFilter);
if(it&&it.desk){
// a desk: "/money // 15 transmissions // show all ✕"
deskMark(fb,it.desk);
fb.appendChild(document.createTextNode(' // '+plural(it.n,'transmission','transmissions')+' // '));
}else if(it&&it.tag){
// one of the curator's tags, in his amber: "wtf // 3 transmissions // show all ✕"
var tw=mkEl('span','bb-tag-word');
tw.textContent=it.tag;
fb.appendChild(tw);
fb.appendChild(document.createTextNode(' // '+plural(it.n,'transmission','transmissions')+' // '));
}else fb.appendChild(document.createTextNode('showing '+label+' // '));
var b=mkEl('b');
b.textContent='show all ✕';
fb.appendChild(b);
fb.style.display='';
}

function tickText(it){return it.f?'[ '+it.t+' ]':it.t;}
// write (or rewrite) one ticker item; a desk gets "[ 15 /money ]" with the
// slash in red and the name in the desk's colour
function fillTick(s,it){
var key=(it.dot?'dot|':'')+tickText(it);
if(s.__bbTick===key)return;
s.__bbTick=key;
clearEl(s);
if(it.dot)s.appendChild(mkEl('span','bb-tick-dot'));
if(it.desk){
s.appendChild(document.createTextNode('[ '+it.n+' '));
deskMark(s,it.desk);
s.appendChild(document.createTextNode(' ]'));
}else s.appendChild(document.createTextNode(tickText(it)));
}
function tickIsActive(it){return !!it.f&&it.f===activeFilter;}
function tickHalf(){return tickTrack.offsetWidth/2;}

// start (or restart) the scroll from a given position in pixels
function tickRun(pos){
var half=tickHalf()||1;
var dur=Math.max(12,half/TICK_SPEED);
tickTrack.style.transform='';
tickTrack.style.animation='bb-scroll '+dur.toFixed(2)+'s linear infinite';
tickTrack.style.animationDelay='-'+((pos%half)/half*dur).toFixed(3)+'s';
}

function tickerBuild(items){
clearEl(tickTrack);
function addSet(){
items.forEach(function(it){
var s=mkEl('span','bb-tick-item'+(it.c?' '+it.c:'')+(tickIsActive(it)?' tick-active':''));
s.setAttribute('data-k',it.k);
if(it.f)s.setAttribute('data-f',it.f);
fillTick(s,it);
tickTrack.appendChild(s);
var sep=mkEl('span','bb-tick-sep');
sep.textContent='///';
tickTrack.appendChild(sep);
});
}
// repeat the set until it is wider than the ticker, then double it so the
// scroll can loop without a visible seam
addSet();
var one=tickTrack.offsetWidth||1;
var need=Math.min(40,Math.max(1,Math.ceil((tickMask.clientWidth+200)/one)));
for(var i=1;i<need;i++)addSet();
var count=tickTrack.childNodes.length;
for(var j=0;j<count;j++)tickTrack.appendChild(tickTrack.childNodes[j].cloneNode(true));
if(tickPaused){tickTrack.style.animation='none';tickSet(tickPos);}else tickRun(0);
}

function tickerUpdate(){
var items=tickerItems();
var sig=items.map(function(i){return i.k;}).join('|')+'@'+tickMask.clientWidth;
if(sig!==tickSig){tickSig=sig;tickerBuild(items);return;}
items.forEach(function(it){
var on=tickIsActive(it);
var els=tickTrack.querySelectorAll('[data-k="'+it.k+'"]');
for(var i=0;i<els.length;i++){
fillTick(els[i],it);
els[i].classList.toggle('tick-active',on);
}
});
}

// Paused = the strip stands still exactly where it was. Running = it scrolls
// by itself, picking up from where it stood.
// TICKER DRAG (Oct 2026): the strip can be dragged sideways with a finger (or
// the mouse) at any moment, not only while paused. It picks up scrolling 3
// seconds after it is let go, unless a filter is on.
var tickPos=0,tickDrag=null,tickDragEnd=0;
var TICK_RESUME_MS=3000;
function tickOffset(){
var m=getComputedStyle(tickTrack).transform;
var mm=m&&m!=='none'?m.match(/matrix\(([^)]+)\)/):null;
return mm?(-parseFloat(mm[1].split(',')[4])||0):0;
}
// hold the strip at a position, wrapping round so it never runs out
function tickSet(p){
var half=tickHalf();
p=half>0?p%half:0;
if(p<0)p+=half;
tickPos=p;
tickTrack.style.transform='translateX('+(-p)+'px)';
}
function tickerPause(val){
if(val===tickPaused)return;
tickPaused=val;
if(val){
var off=tickOffset();
tickTrack.style.animation='none';
tickSet(off);
}else{
tickRun(tickPos);
}
}
function tickResumeLater(){
if(tickTimer)clearTimeout(tickTimer);
tickTimer=setTimeout(function(){tickTimer=null;if(!activeFilter&&!tickDrag)tickerPause(false);},TICK_RESUME_MS);
}
tickMask.addEventListener('pointerdown',function(e){
if(e.pointerType==='mouse'&&e.button!==0)return;
if(tickTimer){clearTimeout(tickTimer);tickTimer=null;}
tickerPause(true);
tickDrag={id:e.pointerId,x:e.clientX,start:tickPos,moved:false};
});
window.addEventListener('pointermove',function(e){
if(!tickDrag||e.pointerId!==tickDrag.id)return;
var dx=e.clientX-tickDrag.x;
if(!tickDrag.moved){
if(Math.abs(dx)<6)return;
tickDrag.moved=true;
try{tickMask.setPointerCapture(e.pointerId);}catch(ex){}
}
tickSet(tickDrag.start-dx);
});
function tickDragStop(e){
if(!tickDrag||e.pointerId!==tickDrag.id)return;
if(tickDrag.moved)tickDragEnd=Date.now();
tickDrag=null;
if(!activeFilter)tickResumeLater();
}
window.addEventListener('pointerup',tickDragStop);
window.addEventListener('pointercancel',tickDragStop);

function setFilter(f,keepScroll){
var changed=f!==activeFilter;
activeFilter=f;
if(tickTimer){clearTimeout(tickTimer);tickTimer=null;}
if(changed&&allLines.length)render();
tickerUpdate();
tickerPause(!!activeFilter);
if(!keepScroll)window.scrollTo({top:0});
}

function jumpToLatest(){
if(!latestId)return window.scrollTo({top:0,behavior:'smooth'});
var cs=document.querySelectorAll('.post-container[data-post-id]'),el=null;
for(var i=0;i<cs.length;i++)if(cs[i].getAttribute('data-post-id')===latestId){el=cs[i];break;}
if(!el)return window.scrollTo({top:0,behavior:'smooth'});
if(el.closest('#bb-archive-section')&&!sec.classList.contains('open')){sec.classList.add('open');syncArchiveBtn();}
setTimeout(function(){if(document.body.contains(el))el.scrollIntoView({behavior:'smooth',block:'center'});},60);
}

function tickerTap(f){
if(f==='all')return setFilter(null);
if(f==='latest'){setFilter(null,true);return jumpToLatest();}
setFilter(f===activeFilter?null:f);
}

tickOuter.addEventListener('click',function(e){
var t=e.target;
if(!t||!t.closest)return;
if(Date.now()-tickDragEnd<350)return; // the end of a drag is not a tap
var item=t.closest('.bb-tick-item[data-f]');
if(item)return tickerTap(item.getAttribute('data-f'));
// the red "§ bb" label pauses and resumes the ticker
if(t.closest('#bb-ticker-label')){
if(tickTimer){clearTimeout(tickTimer);tickTimer=null;}
tickerPause(!tickPaused);
if(tickPaused&&!activeFilter)tickResumeLater();
}
});
tickOuter.addEventListener('touchstart',function(){},{passive:true}); // lets the tap highlight show on iOS
document.addEventListener('touchstart',function(){},{passive:true}); // and the press look on cards

fb.addEventListener('click',function(){setFilter(null);});

var tickResize=null;
window.addEventListener('resize',function(){
if(tickResize)clearTimeout(tickResize);
tickResize=setTimeout(tickerUpdate,200);
});

tickerUpdate();

// ── DISPLAY SWITCH (Oct 2026) ──
var disp=document.getElementById('bb-display');
function drawDisplay(){
var m=window.bbDisplay.get(),bs=disp.querySelectorAll('button[data-mode]');
for(var i=0;i<bs.length;i++)bs[i].setAttribute('aria-pressed',String(bs[i].getAttribute('data-mode')===m));
}
if(window.bbDisplay){
disp.addEventListener('click',function(e){
var b=e.target.closest('button[data-mode]');
if(!b)return;
window.bbDisplay.set(b.getAttribute('data-mode'));
drawDisplay();
});
drawDisplay();
}else disp.style.display='none';

})();
</script>
